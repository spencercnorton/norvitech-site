name: Feature request
description: Propose a change to how the site works.
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that the site makes hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change, and what should it look like?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: ["Page content or a broken link", "Layout, phone width or dark mode", "Accessibility", "Other / not sure"]
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
