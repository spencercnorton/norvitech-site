name: Bug report
description: Something in the site does not behave as documented.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please remove anything private from logs and output before pasting them: anything that identifies you or your machine.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open https://norvitech.com in …
        2. …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: ["Page content or a broken link", "Layout, phone width or dark mode", "Accessibility", "Other / not sure"]
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "Browser and operating system."
      placeholder: "Firefox 145 on Ubuntu 26.04"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log excerpt
      description: "Browser console output, if any. Scrubbed."
      render: text
