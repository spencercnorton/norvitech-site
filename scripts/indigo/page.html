<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#241f31">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="stylesheet" href="/style.css">
<title>{title} · Indigo · NorviTech</title>
<meta name="description" content="{description}">
<link rel="canonical" href="{canonical}">
<meta property="og:type" content="article">
<meta property="og:site_name" content="NorviTech">
<meta property="og:title" content="{title} · Indigo · NorviTech">
<meta property="og:description" content="{description}">
<meta property="og:url" content="{canonical}">
<meta property="og:image" content="https://norvitech.com/assets/og-indigo.png">
<meta property="og:image:width" content="1280">
<meta property="og:image:height" content="640">
<meta property="og:image:alt" content="Indigo on the GameCube: a glass cube showing a GameCube controller, with LIBRARY named underneath">
<meta property="og:locale" content="en_US">
<meta name="twitter:card" content="summary_large_image">
<link rel="alternate" type="application/atom+xml" title="Indigo releases" href="https://github.com/spencercnorton/indigo/releases.atom">
<script src="/site.js" defer></script>
</head>
<body>

{header}

<main class="wrap">

<section class="hero app doc-hero">
  <p class="crumb">{crumbs}</p>
  <h1>{title}</h1>
</section>

<div class="docs">
<nav class="docnav glass" aria-label="Indigo guide">
{nav}
</nav>
<article class="doc">
{body}
<nav class="pager" aria-label="Previous and next page">
{pager}
</nav>
<p class="docsrc">From <a href="{source}">{path}</a> in Indigo {ref}, rendered for the web. Spotted a mistake? <a href="{edit}">Suggest an edit</a>.</p>
</article>
</div>

</main>

{footer}

</body>
</html>
